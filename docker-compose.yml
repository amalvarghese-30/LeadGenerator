services:
  backend:
    build: ./backend
    container_name: leadintel-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    container_name: leadintel-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: ["python", "-m", "app.workers.job_processor"]

  frontend:
    build: ./frontend
    container_name: leadintel-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
